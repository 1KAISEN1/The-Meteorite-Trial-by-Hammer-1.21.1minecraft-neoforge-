modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "trial_by_hammer"
version = "${file.jarVersion}"
displayName = "Trial by Hammer"
authors = "KAISEN1"
description = '''
以陨铁、合金与锻造为核心的内容模组。
陨铁中的"天外因子"只有在形成合金并经过可控的熔炼与锻造后才会显现。
'''

# NeoForge 是硬依赖：没有加载器一切都不成立。
[[dependencies.trial_by_hammer]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.trial_by_hammer]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Create 最终会是 required（本模组定位是完整附属）。
# 但当前处在探针阶段，开发客户端默认不加载 Create，
# 所以先降为 optional；正式接入 Create API 时改回 required，
# 并把 create jar 放进 run/mods/。
[[dependencies.trial_by_hammer]]
modId = "create"
type = "optional"
versionRange = "[6.0.0,)"
ordering = "NONE"
side = "BOTH"
