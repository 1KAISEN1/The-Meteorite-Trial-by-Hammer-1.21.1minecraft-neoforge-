# Trial by Hammer —— 构建属性
#
# 所有版本号集中在这里，代码和构建脚本里不要再出现硬编码版本，
# 升级时只改这个文件。

# Gradle 守护进程内存。1.21 的 NeoForm 反编译比较吃内存，3G 是够用的下限。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# 显式指定 JDK 21，避免被系统 PATH 上的 JDK 25 抢走。
# NeoForge 21.1 要求 Java 21 编译，JDK 25 会直接编译失败。
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-21

# ---- 版本 ----
minecraft_version=1.21.1
# NeoForge 21.1.252 已在本机 Gradle 缓存里，可离线构建；
# 运行时用 21.1.228 也兼容（同一 21.1.x 线）。
neo_version=21.1.252
create_version=6.0.10

# ---- 模组元数据 ----
mod_id=trial_by_hammer
mod_name=Trial by Hammer
mod_version=0.1.0
mod_group=com.trialbyhammer
